<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>모의투자 관리자 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --card: #ffffff;
      --card2: #f6f8fc;
      --border: #dfe6f0;
      --border2: #cdd7e6;
      --txt: #1b2536;
      --muted: #66768c;
      --muted2: #8593a6;
      --accent: #0a7fb0;
      --gold: #b7860b;
      --green: #0f9d6b;
      --danger: #e5334a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* 상단 바 */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-logo { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
    .role-badge { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; }
    .badge-head { background: rgba(245,200,66,0.2); color: var(--gold); border: 1px solid rgba(183,134,11,0.4); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    #topbarUser { font-size: 12px; color: var(--muted); }

    /* 버튼 */
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 10px; border: 0; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; filter: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--txt); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { height: 34px; font-size: 12px; padding: 0 14px; border-radius: 8px; }

    /* 탭 */
    .tab-nav { display: flex; gap: 2px; padding: 16px 24px 0; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
    .tab-btn { padding: 10px 20px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; }
    .tab-btn:hover { color: var(--txt); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* 탭 콘텐츠 */
    .tab-content { display: none; padding: 24px; max-width: 900px; }
    .tab-content.active { display: block; }

    /* 섹션 */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
    .section-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* 카드 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; position: relative; z-index: 1; }
    .card-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    /* 폼 */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-group label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; height: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--txt); padding: 0 12px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: var(--card); }

    /* 리스트 */
    .data-list { display: flex; flex-direction: column; gap: 8px; }
    .data-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; gap: 12px; }
    .data-item-left { flex: 1; min-width: 0; }
    .data-item-name { font-size: 14px; font-weight: 500; }
    .data-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .data-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* 스탯 */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; z-index: 1; }
    .stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.gold { color: var(--gold); }
    .stat-value.green { color: var(--green); }

    /* 랭킹 */
    .rank-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 10px; transition: background 0.15s; }
    .rank-item:hover { background: var(--card2); }
    .rank-num { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; width: 28px; text-align: center; color: var(--muted2); }
    .rank-num.r1 { color: var(--gold); }
    .rank-num.r2 { color: #8a94a3; }
    .rank-num.r3 { color: #b0651f; }
    .rank-info { flex: 1; }
    .rank-name { font-size: 13px; font-weight: 500; }
    .rank-asset { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); }

    /* 알림 */
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
    .alert.show { display: block; }
    .alert-success { background: rgba(15,157,107,0.1); border: 1px solid rgba(15,157,107,0.35); color: var(--green); }
    .alert-error { background: rgba(229,51,74,0.08); border: 1px solid rgba(229,51,74,0.3); color: var(--danger); }
    .alert-info { background: rgba(10,127,176,0.08); border: 1px solid rgba(10,127,176,0.25); color: var(--accent); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(10,127,176,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .form-grid, .form-grid.cols-3 { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .tab-content { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- 상단 바 -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">ADMIN</span>
      <span id="roleBadge" class="role-badge"></span>
    </div>
    <div class="topbar-right">
      <span id="topbarUser"></span>
      <button id="logoutBtn" class="btn btn-outline btn-sm">로그아웃</button>
    </div>
  </div>

  <!-- 탭 네비 -->
  <div class="tab-nav" id="tabNav">
    <div class="tab-btn" data-tab="students" onclick="switchTab('students')">🎓 학생 관리</div>
    <div class="tab-btn" data-tab="ranking"  onclick="switchTab('ranking')">🌐 전체 랭킹</div>
  </div>

  <!-- 학생 관리 -->
  <div id="tab-students" class="tab-content fade-in">
    <div class="section-header">
      <div><div class="section-title">학생 관리</div><div class="section-sub">학생 계정 생성 및 관리</div></div>
    </div>
    <div class="card">
      <div class="card-title">학생 계정 생성</div>
      <div id="studentAddAlert" class="alert"></div>
      <div class="form-grid cols-3">
        <div class="form-group"><label>이메일</label><input id="newStudentEmail" type="email" placeholder="student01@school.kr" /></div>
        <div class="form-group"><label>비밀번호</label><input id="newStudentPw" type="password" placeholder="초기 비밀번호" /></div>
        <div class="form-group"><label>닉네임</label><input id="newStudentNick" placeholder="홍길동" /></div>
      </div>
      <div style="background:rgba(229,51,74,0.06); border:1px solid rgba(229,51,74,0.35); border-left:3px solid var(--danger); border-radius:10px; padding:12px 16px; margin-bottom:14px;">
        <div style="color:var(--danger); font-size:13px; font-weight:700; margin-bottom:4px;">⚠️ 개인정보 입력 금지</div>
        <div style="color:#c0283d; font-size:12px; line-height:1.8;">
          • <b>이메일</b>과 <b>닉네임</b>에 실명, 생년월일, 학번 등 <b>개인정보를 입력하지 마세요.</b><br>
          • 예) 이메일: <span style="color:var(--txt);">student01@school.kr</span> / 닉네임: <span style="color:var(--txt);">투자왕</span> (별명 사용 권장)
        </div>
      </div>
      <button id="createStudentBtn" class="btn btn-primary btn-sm" style="width:auto; padding:0 20px;" onclick="createStudent()">학생 계정 생성</button>
    </div>
    <div class="card">
      <div class="card-title">학생 목록</div>
      <div id="studentList" class="data-list"><div class="empty-state">등록된 학생이 없습니다.</div></div>
    </div>
  </div>

  <!-- 전체 랭킹 -->
  <div id="tab-ranking" class="tab-content fade-in">
    <div class="section-header">
      <div><div class="section-title">전체 랭킹</div><div class="section-sub">전체 학생 TOP 30</div></div>
      <button class="btn btn-outline btn-sm" onclick="loadAllRanking()">↻ 새로고침</button>
    </div>
    <div class="card"><div id="allRankList"><div class="empty-state">로딩 중...</div></div></div>
  </div>

<script type="module" src="./admin.js"></script>
</body>
</html>
